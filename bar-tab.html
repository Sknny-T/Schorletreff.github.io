<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10151d"><title>Bar Tab</title>
<style>
:root{color-scheme:dark;--bg:#0d1219;--panel:#171f2a;--muted:#aab5c5;--line:#303c4d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#192433 0,#0d1219 55%);color:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;padding:env(safe-area-inset-top) 14px calc(14px + env(safe-area-inset-bottom))}.app{max-width:760px;margin:auto;min-height:calc(100dvh - 30px);display:flex;flex-direction:column;gap:0}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 18px}.brand{font-size:26px;font-weight:800;letter-spacing:-.7px}.iconbtn{border:1px solid var(--line);background:#19222e;color:#e8edf6;border-radius:14px;width:46px;height:46px;font-size:23px}.undobtn{width:100%;min-width:0;min-height:54px;border-radius:13px;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px}.sub{color:var(--muted);font-size:12px;margin-top:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(158px,1fr);gap:10px;flex:1}.item{min-width:0;min-height:0;border:0;border-radius:20px;padding:12px 8px 10px;color:white;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;box-shadow:inset 0 1px 0 #ffffff22;touch-action:manipulation;transition:transform .08s}.item:active{transform:scale(.97)}.emoji{display:none}.name{font-size:clamp(13px,3.8vw,17px);font-weight:750;line-height:1.1;overflow-wrap:anywhere}.price{font-size:clamp(14px,4vw,18px);font-weight:700;color:#f1f3f8d9}.countrow{display:flex;align-items:center;justify-content:space-between;gap:2px;width:100%;min-width:0;background:#07101975;border-radius:999px;padding:3px 4px;margin-top:2px;overflow:hidden}.count{font-size:16px;font-weight:800;min-width:20px}.plus,.minus{font-size:28px;font-weight:400;line-height:32px;width:40px;height:42px;flex:0 0 40px;border:0;border-radius:50%;background:#ffffff19;color:white;touch-action:manipulation}.minus{font-size:28px}.count{flex:1;text-align:center}.totalbox{margin-top:16px;padding-top:0;flex:0 0 auto}.totalcard{background:linear-gradient(135deg,#1a2431,#121923);border:1px solid #293444;border-radius:22px;padding:17px}.totalhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.label{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:1.5px}.amount{font-size:clamp(34px,10vw,48px);font-weight:850;letter-spacing:-1.5px;line-height:1.2}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.action{border:1px solid #3a475a;background:#1a2431;color:#eef3fb;border-radius:13px;min-height:44px;font-size:14px;font-weight:700}.action{min-height:54px;font-size:15px}.action:disabled{opacity:.35}.hint{text-align:center;color:#8592a5;font-size:11px;margin:10px 0 0}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.overlay.open{display:flex}.sheet{width:100%;max-width:600px;max-height:88dvh;overflow:auto;background:#151e29;border:1px solid #354254;border-radius:24px;padding:20px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sheet h2{font-size:21px;margin:0}.close{background:#293444;color:white;border:0;border-radius:10px;padding:9px 12px}.field{display:grid;grid-template-columns:1fr 88px 36px;gap:7px;align-items:center;margin:9px 0}.field input{min-width:0;width:100%;background:#0e151e;color:white;border:1px solid #3a4758;border-radius:10px;padding:11px 8px;font-size:15px}.remove{border:0;border-radius:9px;background:#492b36;color:#ffc6d0;height:39px;font-size:18px}.sheetactions{display:flex;gap:8px;margin-top:16px}.sheetactions button{flex:1;padding:12px;border-radius:12px;font-weight:750;border:1px solid #46556a;background:#253244;color:white}.sheetactions .primary{background:#d9e7ff;color:#111b29;border:0}.smallnote{font-size:12px;line-height:1.45;color:#aab5c5;margin:12px 0}.item.pfand{grid-column:1/-1;min-height:88px;display:grid;grid-template-columns:minmax(0,1fr) minmax(145px,.8fr);grid-template-rows:auto auto;gap:4px 14px;padding:12px 16px}.item.pfand .name{grid-column:1;grid-row:1;align-self:end;text-align:left}.item.pfand .price{grid-column:1;grid-row:2;align-self:start;text-align:left}.item.pfand .countrow{grid-column:2;grid-row:1/3;align-self:center;margin-top:0}.empty{grid-column:1/-1;color:var(--muted);padding:30px 10px;text-align:center}
@media(max-width:420px){body{padding-left:10px;padding-right:10px}.top{padding-bottom:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(150px,1fr);gap:9px}.item.pfand{grid-column:1/-1;grid-template-columns:minmax(0,1fr) minmax(130px,.8fr);min-height:78px}.name{font-size:clamp(14px,4vw,17px)}.plus,.minus{width:38px;flex-basis:38px}.totalcard{padding:14px}.amount{font-size:clamp(34px,9vw,46px)}}
@media(min-width:600px){body{padding-left:22px;padding-right:22px}.grid{gap:14px}.grid{grid-auto-rows:minmax(175px,1fr)}.item.pfand{min-height:92px}.emoji{font-size:34px}}
@media(max-height:780px){.grid{flex:0 0 auto;grid-auto-rows:minmax(135px,auto)}.item{min-height:135px}.item.pfand{min-height:78px}.totalbox{margin-top:12px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">Bar Tab</div><div class="sub">Tap a drink to add it to your tab</div></div><button class="iconbtn" id="settings" aria-label="Edit items">⚙</button></header><section class="grid" id="grid"></section><section class="totalbox"><div class="totalcard"><div class="totalhead"><div><div class="label">TOTAL</div><div class="amount" id="total">€0.00</div></div></div><div class="actions"><button class="action" id="reset">Reset tab</button><button class="action undobtn" id="undo" aria-label="Undo last tap" title="Undo last tap"><span aria-hidden="true">↶</span><span>Undo</span></button></div></div><p class="hint">Your tab stays on this device if you close the page.</p></section></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Edit items"><div class="sheet"><div class="sheethead"><h2>Customize buttons</h2><button class="close" id="close">Done ✕</button></div><p class="smallnote">Set up your usual drinks here. After that, using the tab is just tapping buttons. Changes are saved on this device.</p><div id="fields"></div><div class="sheetactions"><button id="add">＋ Add item</button><button class="primary" id="save">Save buttons</button></div><p class="smallnote">Use short names so the buttons stay easy to tap.</p></div></div>
<script>
const defaults=[{name:'Rieslingschorle',price:4.5,color:'#a98212'},{name:'Weißherbstschorle',price:4.5,color:'#167455'},{name:'Bellheimer Pils',price:3,color:'#b52f49'},{name:'Traubensaftschorle',price:3.5,color:'#2475b8'},{name:'Glas Wasser',price:1.5,color:'#7042a0'},{name:'Flasche Wasser',price:2.5,color:'#137b87'},{name:'Pfand',price:4,color:'#526273'}];
const $=id=>document.getElementById(id);let items=[],history=[];
function load(){try{const saved=JSON.parse(localStorage.getItem('bartab.items.v2'));items=Array.isArray(saved)&&saved.length?saved:defaults.map(x=>({...x,count:0}));}catch{items=defaults.map(x=>({...x,count:0}));}items=items.map(x=>({...x,count:Number(x.count)||0,price:Number(x.price)||0}));if(!items.some(x=>String(x.name).trim().toLowerCase()==='pfand'))items.push({...defaults[6],count:0});}
function persist(){localStorage.setItem('bartab.items.v2',JSON.stringify(items));}
function money(n){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n)}
function total(){return items.reduce((s,x)=>s+x.price*x.count,0)}
function render(){const grid=$('grid');grid.innerHTML='';if(!items.length)grid.innerHTML='<div class="empty">Add items in ⚙ settings to get started.</div>';items.forEach((it,i)=>{const card=document.createElement('div');card.className='item'+(String(it.name).trim().toLowerCase()==='pfand'?' pfand':'');card.style.background=`linear-gradient(145deg,${it.color||'#34465b'},${it.color||'#34465b'}cc)`;card.setAttribute('role','group');card.setAttribute('aria-label',`${it.name}, ${money(it.price)}`);card.innerHTML=`<span class="name">${esc(it.name)}</span><span class="price">${money(it.price)}</span><span class="countrow"><button class="minus" aria-label="Remove one ${esc(it.name)}" ${it.count<=0?'disabled':''}>−</button><span class="count">${it.count}</span><button class="plus" aria-label="Add one ${esc(it.name)}">+</button></span>`;const change=delta=>{if(delta<0&&items[i].count<=0)return;history.push(items.map(x=>({...x})));items[i].count+=delta;persist();render()};card.addEventListener('click',e=>{if(e.target.closest('.countrow'))return;change(1)});card.querySelector('.plus').addEventListener('click',e=>{e.stopPropagation();change(1)});card.querySelector('.minus').addEventListener('click',e=>{e.stopPropagation();change(-1)});grid.appendChild(card)});$('total').textContent=money(total());$('undo').disabled=!history.length;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showSettings(){const f=$('fields');f.innerHTML='';items.forEach((it,i)=>{const row=document.createElement('div');row.className='field';row.innerHTML=`<input aria-label="Item name" data-k="name" placeholder="Name" value="${esc(it.name)}"><input aria-label="Price in euros" data-k="price" type="number" min="0" step="0.5" placeholder="€" value="${it.price}"><button class="remove" aria-label="Remove item">×</button>`;row.querySelector('.remove').onclick=()=>{items.splice(i,1);showSettings()};f.appendChild(row)});$('overlay').classList.add('open')}
$('settings').onclick=showSettings;$('close').onclick=()=>$('overlay').classList.remove('open');$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')});$('add').onclick=()=>{items.push({name:'New item',price:1,color:defaults[items.length%defaults.length].color,count:0});showSettings()};$('save').onclick=()=>{const rows=[...$('fields').children];items=rows.map((row,i)=>{const old=items[i]||{};const get=k=>row.querySelector(`[data-k="${k}"]`).value;return {...old,name:get('name').trim()||'Item',price:Math.max(0,Number(get('price'))||0),color:old.color||defaults[i%defaults.length].color,count:old.count||0}});history=[];persist();render();$('overlay').classList.remove('open')};$('undo').onclick=()=>{if(history.length){items=history.pop();persist();render()}};$('reset').onclick=()=>{if(items.some(x=>x.count)){history.push(items.map(x=>({...x})));items=items.map(x=>({...x,count:0}));persist();render()}};
load();render();
</script></body></html>
